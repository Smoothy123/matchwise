# The web frontend: formatting, lint, types, unit and component tests, then the end-to-end tests
# in a real browser on the production build. The end-to-end tests replay responses recorded from
# the real API, so no backend, database or LLM key is needed here.
name: Web

on:
  push:
    paths: ['web/**', 'evals/results/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'evals/results/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          if-no-files-found: ignore
