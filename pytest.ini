[pytest]
testpaths = tests
pythonpath = .
# Live LLM tests use your API quota, so they only run when asked: pytest -m live
addopts = -q -m "not live"
markers =
    model: loads the real MiniLM model (downloaded once into the models volume)
    live: calls the real LLM API (needs LLM_API_KEY and LLM_MODEL in .env)
